<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idul Fitri - By Nurfadil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <audio src="backsound.mp3" id="linkmp3" loop></audio>

    <div class="container">
        <div class="image-center">
            <img src="halo.png" alt="Karakter" id="image-gif">

        <div class="text-wrapper">
            <p id="text">Klik tombol di bawah untuk mulai</p>
        </div>
    
        <div class="button-area">
            <button type="button" class="next" value="0">Nextt</button>
            
            <div id="option-buttons" style="display: none;">
                <button type="button" class="btn-choice" id="btn-yes">Iya Dimaafin</button>
                <button type="button" class="btn-choice" id="btn-no">Nggak Mau</button>
            </div>
        </div>
    </div>
